5 6.5 11 11M17.5 6.5l-11 11\"><\u002Fpath><\u002Fg>\n    <g id=\"i-scale\"><path d=\"M12 4v16M7 20h10M5 7.5h14\"><\u002Fpath><path d=\"M5 7.5 2.8 13a3 3 0 0 0 4.4 0zM19 7.5 16.8 13a3 3 0 0 0 4.4 0z\"><\u002Fpath><\u002Fg>\n  <\u002Fdefs><\u002Fsvg>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;max-width:1280px;width:100%\">\n    <div style=\"display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-right:auto\"><span style=\"width:32px;height:32px;border-radius:10px;background:var(--salary);color:var(--on-accent);display:flex;align-items:center;justify-content:center\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"#i-wallet\"><\u002Fuse><\u002Fsvg><\u002Fspan><span>Money Tracker <span style=\"font-size:12px;font-weight:500;color:var(--ink3);margin-left:6px\">v1 prototype · demo date Oct 14, 2026<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px\">\n      <sc-for list=\"{{ viewOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"border:0;border-radius:7px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px\">\n      <sc-for list=\"{{ themeOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"border:0;border-radius:7px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px\">\n      <sc-for list=\"{{ scenarioOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"border:0;border-radius:7px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ simulateReminder }}\" style=\"border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap;cursor:pointer\">Simulate 21:00 reminder<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:10px;background:oklch(0.2 0.012 55);border-radius:54px;box-shadow:0 30px 60px -20px oklch(0.25 0.03 55 / 0.35)\">\n  <div style=\"position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;background:var(--bg);color:var(--ink)\">\n\n    <div style=\"position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:15px;font-weight:600;z-index:5;background:var(--bg)\">\n      <span>9:41<\u002Fspan>\n      <span style=\"width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;display:block;position:relative\"><span style=\"position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:15px;background:var(--ink);border-radius:1px;display:block\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;top:48px;left:0;right:0;bottom:0;overflow-y:auto;padding-bottom:130px;scrollbar-width:none\" data-hscroll=\"1\">\n\n      <!-- ONBOARDING -->\n      <sc-if value=\"{{ isOnboarding }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"min-height:780px;display:flex;flex-direction:column;padding:12px 24px 28px\">\n          <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:28px\">\n            <sc-for list=\"{{ ob.dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <span style=\"height:4px;flex:1;border-radius:2px;background:{{ d.bg }};display:block\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:10px\">{{ ob.stepLabel }}<\u002Fdiv>\n\n          <sc-if value=\"{{ ob.s1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:18px;flex:1\">\n              <h1 style=\"font-size:32px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:pretty\">Track your salary and your savings, separately.<\u002Fh1>\n              <p style=\"margin:0;color:var(--ink2);font-size:16px;line-height:1.5\">See what's left of this month's pay, and know exactly how much savings you have after spending from it.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:12px\">\n                <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px\">\n                  <div style=\"display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px\"><span style=\"width:32px;height:32px;border-radius:10px;background:var(--salary-soft);color:var(--salary);display:flex;align-items:center;justify-content:center;flex:none\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg><\u002Fspan>Your data stays on this device<\u002Fdiv>\n                  <div style=\"color:var(--ink2);font-size:14px;line-height:1.45\">No login, no cloud. Everything is stored in this browser only.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:var(--warn-soft);border:1px solid var(--line);border-radius:18px;padding:16px\">\n                  <div style=\"display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px\"><span style=\"width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--warn-ink);display:flex;align-items:center;justify-content:center;flex:none\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px\"><use href=\"#i-save\"><\u002Fuse><\u002Fsvg><\u002Fspan>Back up regularly<\u002Fdiv>\n                  <div style=\"color:var(--ink2);font-size:14px;line-height:1.45\">If you clear browser data, anything without a backup is gone. Export a backup file from Settings at least once a month.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ ob.s2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;flex:1\">\n              <h1 style=\"font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em\">Add your accounts<\u002Fh1>\n              <p style=\"margin:0;color:var(--ink2);font-size:15px;line-height:1.45\">Banks, e-wallets or cash. Mark one as Salary — that's where your pay lands.<\u002Fp>\n              <sc-for list=\"{{ ob.accounts }}\" as=\"a\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px\">\n                  <span style=\"width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:{{ a.soft }};color:{{ a.color }}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><use href=\"{{ a.icon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n                  <div style=\"flex:1;min-width:0\"><div style=\"font-weight:600\">{{ a.name }}<\u002Fdiv><div style=\"font-size:13px;color:var(--ink3)\">{{ a.meta }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-weight:600\">{{ a.balStr }}<\u002Fdiv>\n dden=\"true\" style=\"width:17px;height:17px\"><use href=\"{{ o.icon }}\"><\u002Fuse><\u002Fsvg>{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px\">\n                  <span style=\"color:var(--ink3)\">Rp<\u002Fspan>\n                  <input value=\"{{ ob.form.balStr }}\" sc-camel-on-change=\"{{ ob.onBal }}\" sc-camel-input-mode=\"numeric\" placeholder=\"Starting balance\" style=\"flex:1;border:0;background:none;padding:12px 6px;font-size:15px;outline:none\">\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ ob.add }}\" style=\"border:1px dashed var(--ink3);background:none;border-radius:12px;padding:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:18px;height:18px\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>Add account<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ ob.needSalary }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px;color:var(--ink2)\">Add at least one Salary account to continue.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ ob.s3 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px;flex:1\">\n              <h1 style=\"font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em\">Your pay cycle<\u002Fh1>\n              <p style=\"margin:0;color:var(--ink2);font-size:15px;line-height:1.45\">Months run payday to payday. Leftover salary is swept to savings at the end of each cycle.<\u002Fp>\n              <div style=\"font-weight:600;font-size:14px\">Payday<\u002Fdiv>\n              <div style=\ \u002Fsvg>Total savings<\u002Fdiv>\n            <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px\">{{ savingsTotalStr }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:{{ savSpentColor }};margin-bottom:14px\">{{ savSpentLine }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ savingsCards }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px\"><span style=\"display:flex;align-items:center;gap:10px;color:var(--ink2);min-width:0\"><span style=\"width:28px;height:28px;border-radius:9px;background:var(--savings-soft);color:var(--savings);display:flex;align-items:center;justify-content:center;flex:none\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:16px;height:16px\"><use href=\"{{ s.icon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>{{ s.name }}<\u002Fspan><span style=\"font-weight:700\">{{ s.balStr }}<\u002Fspan><\u002Fdiv>\n                  <sc-if value=\"{{ s.hasTarget }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px\"><div style=\"height:100%;width:{{ s.pct }}%;background:var(--savings)\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:12px;color:var(--ink3);margin-top:5px\">{{ s.pctStr }} of {{ s.targetStr }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ s.hasSpent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:var(--expense);margin-top:4px\">{{ s.spentStr }} spent this cycle<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--savings-soft);border:1px solid var(--line);border-radius:22px;padding:18px\">\n              <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--savings);margin-bottom:8px\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:20px;height:20px\"><use href=\"#i-piggy\"><\u002Fuse><\u002Fsvg>Month-end sweep<\u002Fdiv>\n              <div style=\"font-weight:600;line-height:1.35\">Move {{ pending.amountStr }} to {{ pending.toName }}.<\u002Fdiv>\n              <div style=\"color:var(--ink2);font-size:14px;margin:2px 0 12px\">Did you transfer it in your bank app?<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ pending.done }}\" style=\"flex:1;height:40px;border-radius:12px;border:0;background:var(--savings);color:var(--on-accent);font-weight:600;cursor:pointer\">Done<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ pending.skip }}\" style=\"flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer\">Skip<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasRecon }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;font-size:14px;line-height:1.45\"><b>{{ reconSug.name }}<\u002Fb> hasn't been checked in {{ reconSug.days }} days. Compare it with your bank app to catch anything you forgot.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showNothing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px\">\n              <div style=\"font-weight:600;margin-bottom:10px\">Nothing logged today. Did you spend anything ath.round(n/1e3)+'rb';\nconst dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);\nconst nice=s=>{const d=parse(s);return MON[d.getMonth()]+' '+d.getDate();};\nconst addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};\nconst HUES={food:55,transport:235,bills:300,shopping:350,entertainment:190,health:140,other:90};\nconst hueOf=id=>HUES[id]!=null?HUES[id]:([...String(id)].reduce((h,c)=>h+c.charCodeAt(0)*37,0)%360);\nconst catFg=id=>`oklch(var(--cat-l) 0.1 ${hueOf(id)})`;\nconst catChart=id=>`oklch(0.7 0.1 ${hueOf(id)})`;\nconst catBg=id=>`oklch(0.7 0.1 ${hueOf(id)} / 0.2)`;\nconst CAT_ICON={food:'#i-food',transport:'#i-bus',bills:'#i-receipt',shopping:'#i-bag',entertainment:'#i-ticket',health:'#i-heart',other:'#i-tag'};\nconst catIcon=id=>CAT_ICON[id]||'#i-tag';\nconst TYPE_ICON={Bank:'#i-bank','E-wallet':'#i-wallet',Cash:'#i-banknote'};\nconst typeIcon=t=>TYPE_ICON[t]||'#i-bank';\nconst initials=n=>n.split(/\\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();\nconst netOf=(id,txns)=>txns.reduce((s,t)=>{\n  if(t.type==='expense'&&t.acct===id)return s-t.amount;\n  if((t.type==='income'||t.type==='adjust')&&t.acct===id)return s+t.amount;\n  if(t.type==='transfer'){if(t.acct===id)s-=t.amount;if(t.to===id)s+=t.amount;}\n  return s;},0);\nconst SEL={bg:'var(--ink)',fg:'var(--surface)',border:'var(--ink)'};\nconst UNSEL={bg:'var(--surface)',fg:'var(--ink)',border:'var(--line)'};\nconst chip=on=>on?SEL:UNSEL;\n\nfunction seed(sc){\n  const accounts=[\n    {id:'bca',name:'BCA Salary',type:'Bank',role:'Salary',target:null,lastRec:'2026-10-09'},\n    {id:'gopay',name:'GoPay',type:'E-wallet',role:'Salary',target:null,lastRec:'2026-09-26'},\n    {id:'maybank',name:'Maybank Savings',type:'Bank',role:'Savings',target:20000000,lastRec:'2026-10-05'},\n    {id:'jago',name:'Jago Emergency',type:'Bank',role:'Savings',target:15000000,lastRec:'2026-10-01'}];\n  const cats=[['food','Food',2000000],['transport','Transport',800000],['bills','Bills',null],['shopping','Shopping',null],['entertainment','Entertainment',500000],['health','Health',null],['other','Other',null]].map(([id,name,budget])=>({id,name,budget,archived:false}));\n  const T=(type,amount,acct,date,note,x)=>Object.assign({type,amount,acct,date,note},x||{});\n  let txns=[\n    T('income',9000000,'bca','2026-09-25','Salary',{source:'Salary',auto:true}),\n    T('transfer',1000000,'bca','2026-09-25','Emergency fund',{to:'jago'}),\n    T('transfer',500000,'bca','2026-09-26','Top up',{to:'gopay'}),\n    T('expense',400000,'bca','2026-09-28','Groceries',{cat:'food'}),\n    T('expense',400000,'bca','2026-09-30','Electricity',{cat:'bills',auto:true}),\n    T('expense',128000,'gopay','2026-10-01','Grab',{cat:'transport'}),\n    T('expense',450000,'bca','2026-10-04','Concert ticket',{cat:'entertainment'}),\n    T('expense',400000,'bca','2026-10-05','Dinner with friends',{cat:'food'}),\n    T('expense',70000,'gopay','2026-10-06','Movie',{cat:'entertainment'}),\n    T('adjust',-320000,'gopay','2026-10-07','Untracked'),\n    T('expense',200000,'bca','2026-10-08','Fuel',{cat:'transport'}),\n    T('expense',85000,'bca','2026-10-09','Pharmacy',{cat:'health'}),\n    T('expense',350000,'bca','2026-10-10','Internet bill',{cat:'bills',auto:true}),\n    T('expense',715000,'bca','2026-10-11','Groceries',{cat:'food'}),\n    T('expense',1200000,'maybank','2026-10-12','New headphones',{cat:'shopping'}),\n    T('expense',45000,'bca','2026-10-13','Lunch',{cat:'food'}),\n    T('expense',32000,'gopay','2026-10-13','Grab',{cat:'transport'})\n  ].map((t,i)=>Object.assign(t,{id:'t'+(i+1),seq:i+1}));\n  let recurring=[\n    {id:'r1',name:'Salary',type:'income',amount:9000000,acct:'bca',cat:null,day:25,paused:false},\n    {id:'r2',name:'Internet bill',type:'expense',amount:350000,acct:'bca',cat:'bills',day:10,paused:false},\n    {id:'r3',name:'Spotify',type:'expense',amount:55000,acct:'gopay',cat:'entertainment',day:18,paused:false},\n    {id:'r4',name:'Gym membership',type:'expense',amount:300000,acct:'bca',cat:'health',day:20,paused:false},\n    {id:'r5',name:'Phone plan',type:'expense',amount:100000,acct:'gopay',cat:'bills',day:22,paused:false},\n    {id:'r6',name:'Electricity',type:'expense',amount:400000,acct:'bca',cat:'bills',day:30,paused:false}];\n  let hist=[\n    {label:'Apr 25 – May 24',bar:'May',total:6120000,untracked:180000,fromSav:0,savings:14200000},\n    {label:'May 25 – Jun 24',bar:'Jun',total:7380000,untracked:410000,fromSav:1500000,savings:15100000},\n    {label:'Jun 25 – Jul 24',bar:'Jul',total:5840000,untracked:90000,fromSav:0,savings:16000000},\n    {label:'Jul 25 – Aug 24',bar:'Aug',total:6910000,untracked:260000,fromSav:600000,savings:17300000},\n    {label:'Aug 25 – Sep 24',bar:'Sep',total:7240000,untracked:150000,fromSav:0,savings:19600000}];\n  const B={bca:6450000,gopay:350000,maybank:12000000,jago:8500000};\n  let pending={amount:850000,from:'bca',to:'maybank',cycle:'Aug 25 – Sep 24'};\n  if(sc==='over'){B.bca=150000;B.gopay=105000;}\n  if(sc==='empty'){txns=[];recurring=[];hist=[];pending=null;cats.forEach(c=>c.budget=null);accounts.forEach(a=>{a.target=null;a.lastRec=TODAY;});}\n  accounts.forEach(a=>{a.start=B[a.id]-netOf(a.id,txns);});\n  return {accounts,cats,txns,recurring,hist,pending,sweeps:[],\n    settings:{payday:25,salary:9000000,defSav:'maybank',reminder:'21:00',lastBackup:sc==='empty'?null:'2026-09-10',notif:'blocked'}};\n}\n\nclass Component extends DCLogic {\n  state = this.initial((this.props&&this.props.scenario)||'normal');\n\n  initial(sc){\n    const prev=this.state;\n    return Object.assign(seed(sc),{\n      scenario:sc,\n      theme:(prev&&prev.theme)||(this.props&&this.props.theme)||'light',\n      view:(prev&&prev.view)||(this.props&&this.props.view)||'mobile',\n      screen:sc==='onboarding'?'onboarding':'home',acctId:null,sheet:null,qa:null,recon:null,rule:null,toast:null,\n      filters:{type:'all',acct:'all',cat:'all',range:'cycle'},swiped:null,noSpend:false,\n      editingBudgets:false,budgetDra
